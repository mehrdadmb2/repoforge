name = "repoforge-worker"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# One Workers KV namespace is sufficient for the Free-plan deployment.
# No R2 bucket, D1 database, Durable Object, or Paid CPU allowance is required.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
SITE_ORIGIN = "https://mehrdadmb2.github.io"
DASHBOARD_URL = "https://mehrdadmb2.github.io/repoforge/"
MAX_ARCHIVE_BYTES = "19922944"
MAX_EXPANDED_BYTES = "16777216"
MAX_FILE_BYTES = "1048576"
MAX_FILES = "400"
MAX_REMOTE_FILES = "3000"
MAX_CHANGED_FILES = "100"
SESSION_TTL_SECONDS = "21600"
STAGE_TTL_SECONDS = "3600"

[observability]
enabled = true
