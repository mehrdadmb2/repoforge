name: Deploy RepoForge dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'assets/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Pages artifact from repository-root website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          test -f index.html
          test -f config.js
          cp index.html config.js dist/
          cp assets/* dist/assets/
          touch dist/.nojekyll
          echo "Pages artifact contents:"
          find dist -maxdepth 2 -type f -print | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
